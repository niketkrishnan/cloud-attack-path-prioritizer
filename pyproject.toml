[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-attack-path-prioritizer"
version = "0.1.0"
description = "A read-only graph analyzer for explainable cloud attack-path prioritization"
requires-python = ">=3.11"
dependencies = ["networkx>=3.0", "fastapi>=0.110", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
